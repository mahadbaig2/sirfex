name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev,simulation,search]"
      - name: Check formatting
        run: python -m ruff format --check src tests scripts
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Test
        run: python -m pytest

  training:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU training dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,training]"
      - name: Test optional CPU training and validation
        run: python -m pytest tests/unit/test_training.py tests/unit/test_validation.py tests/unit/test_remediation.py tests/integration/test_validation_pipeline.py tests/integration/test_remediation_pipeline.py tests/integration/test_matched_study.py tests/integration/test_phase34.py
